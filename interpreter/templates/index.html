<!DOCTYPE html>
<html>
<head>
    <title>Calculadora</title>
    {% load static %}
    <!-- Cambia esta línea -->
    <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>
        
        <form method="post">
            {% csrf_token %}
            <label for="expr">Expression (ejemplo: 5+3, 7*2, 10/2):</label><br>
            <input type="text" id="expr" name="expr" value="{{ expr }}" required><br><br>
            <button type="submit">Calcular</button>
        </form>

        {% if output %}
        <div class="resultado">
            <h2>Resultado:</h2>
            <p>{{ output }}</p>
        </div>
        {% endif %}

        {% if error_output %}
        <div class="error">
            <h2>Error:</h2>
            <p>{{ error_output }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
